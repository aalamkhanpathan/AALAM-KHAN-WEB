<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORM</title>
</head>
<body style="background-color:grey; color:black;">

  <h1>FORM</h1>
  <hr>

  <form action="" method="get">
    <label>USER NAME:</label>
    <input type="text" placeholder="type here"><br><br>

    <label>PASSWORD:</label>
    <input type="password" placeholder="password"><br><br>

    <label>NAME:</label>
    <input type="text" placeholder="type here"><br><br>

    <label>D.O.B.:</label>
    <input type="date"><br><br>

    <label>Gender:</label>
    <input type="radio" name="User_gender" value="Male"> Male
    <input type="radio" name="User_gender" value="Female"> Female<br><br>
<pre>
<label>Subjects:</label><input type="checkbox" name="subject" value="ai ds"> AI DS
         <input type="checkbox" name="subject" value="AI"> AI
         <input type="checkbox" name="subject" value="CSE AI"> CSE AI
         <input type="checkbox" name="subject" value="CSE AIDS"> CSE AIDS
         <input type="checkbox" name="subject" value="CSE ROBOTICS"> CSE ROBOTICS<br><br>

    <label>Division:</label>
    <select name="DIVISION">
      <option value="div 1">div 1</option>
      <option value="div 2">div 2</option>
      <option value="div 3">div 3</option>
      <option value="div 5">div 5</option>
      <option value="div 6">div 6</option>
      <option value="div 7">div 7</option>
      <option value="div 8">div 8</option>
      <option value="div 9">div 9</option>
      <option value="div 10">div 10</option>
    </select><br><br>

    <label>Rating:</label>
    <input type="range" name="rating"><br><br>

    <input type="submit" value="Submit"><br>
    <input type="reset" value="Reset">
  </form>

</body>
</html>
